name: deploy

# The golden-path release pipeline for the gateway. Deploys ONLY from green main, builds the
# image ONCE and promotes it by immutable @sha256 DIGEST, brings up a GREEN revision at 0%
# traffic, asserts health + the full tool catalog (regression guard for the 2026-07-01
# 838->subset regression), then shifts traffic. The `production` GitHub Environment gates the
# deploy behind a required reviewer (separation of duties). Auth is OIDC (no stored SP secret).
#
# AUTO-DEPLOY: runs on every push to main (i.e. every merge) AND on manual dispatch. Safe because
# (1) branch protection means only build-green code reaches main, (2) the OAuth auth-code store now
# lives in Cosmos so a blue-green revision cutover no longer drops live sessions, and (3) the health
# + tool_count gate below refuses to shift traffic to a bad revision. Rollback = the previous
# immutable digest is still a healthy 0%-traffic revision.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this deploy (audit note)'
        required: false
        default: 'manual release from green main'
  push:
    branches: [main]
    # Only redeploy when something that actually changes the built image changes. A workflow /
    # infra / docs-only merge must NOT spend an ACR build + revision cutover.
    paths-ignore:
      - '.github/**'
      - 'infra/**'
      - 'docs/**'
      - '**.md'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ACR: acrotc55c84f6bef
  APP: otchealth-mcp-gateway
  APPROVAL_APP: otchealth-approval-broker
  APP_RG: rg-otchealth-apps-prod
  IMAGE_REPO: otchealth-mcp-server
  MIN_TOOLS: '1003' # fixed gateway catalog floor after adding owner-approval status read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # human approval gate; reviewer must differ from the release opener
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          # These are non-secret Azure identifiers, NOT credentials. Security is the OIDC federated
          # credential on the `id-gateway-deployer` user-assigned managed identity, which trusts only
          # subject `repo:InnerScopeHearing/otchealth-mcp-server:environment:production`. That identity
          # is least-privilege (Contributor on rg-otchealth-apps-prod + the acrotc55c84f6bef registry
          # only). Hardcoded so the pipeline is self-contained, no repo-variable/secret setup required.
          client-id: 0918788a-f290-4a25-b4cd-2cf3a6faaf57 # id-gateway-deployer (UAMI) clientId
          tenant-id: 4ab58580-cc9c-49f7-b5c7-a77f84fdc270
          subscription-id: 55c84f6b-ef90-4259-a58b-50835cc4cab4

      - name: Build once (immutable, tagged by git sha)
        run: az acr build -r "$ACR" -t "${IMAGE_REPO}:${GITHUB_SHA}" -f Dockerfile .

      - name: Resolve immutable digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST=$(az acr repository show -n "$ACR" --image "${IMAGE_REPO}:${GITHUB_SHA}" --query digest -o tsv)
          echo "ref=${ACR}.azurecr.io/${IMAGE_REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Deploying digest ${DIGEST}"

      - name: Deploy and verify approval broker before opening the provider lane
        id: broker
        run: |
          set -euo pipefail
          az containerapp revision set-mode -n "$APPROVAL_APP" -g "$APP_RG" --mode multiple
          OLD=$(az containerapp revision list -n "$APPROVAL_APP" -g "$APP_RG" --query '[?properties.trafficWeight>`0`].name | [0]' -o tsv)
          SUFFIX="b$(echo "$GITHUB_SHA" | cut -c1-8)r${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          REV="${APPROVAL_APP}--${SUFFIX}"
          echo "previous=${OLD}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          az containerapp update -n "$APPROVAL_APP" -g "$APP_RG" \
            --image "${{ steps.digest.outputs.ref }}" --revision-suffix "$SUFFIX" \
            --command node dist/server/approval-broker-index.js \
            --min-replicas 1 --max-replicas 1 >/dev/null
          FQDN=$(az containerapp revision show -n "$APPROVAL_APP" -g "$APP_RG" --revision "$REV" --query properties.fqdn -o tsv)
          for i in $(seq 1 25); do
            code=$(curl -fsS -o /tmp/approval-health.json -w '%{http_code}' "https://${FQDN}/health" 2>/dev/null || echo 000)
            [ "$code" = "200" ] && break
            sleep 6
          done
          node -e 'const h=require("/tmp/approval-health.json"); if(h.status!=="ok"||!h.key_id||!h.public_jwk_fingerprint_sha256) process.exit(1)'
          az containerapp ingress traffic set -n "$APPROVAL_APP" -g "$APP_RG" --revision-weight "${REV}=100"

      - name: Ensure multiple-revision mode (blue-green)
        run: az containerapp revision set-mode -n "$APP" -g "$APP_RG" --mode multiple

      - name: Deploy GREEN revision (starts at 0% traffic)
        id: green
        run: |
          set -euo pipefail
          OLD=$(az containerapp revision list -n "$APP" -g "$APP_RG" --query '[?properties.trafficWeight>`0`].name | [0]' -o tsv)
          SUFFIX="g$(echo "$GITHUB_SHA" | cut -c1-8)a${GITHUB_RUN_ATTEMPT}"
          echo "previous=${OLD}" >> "$GITHUB_OUTPUT"
          az containerapp update -n "$APP" -g "$APP_RG" \
            --image "${{ steps.digest.outputs.ref }}" --revision-suffix "$SUFFIX" \
            --set-env-vars POSTHOG_GATEWAYOPS_KEY="${{ secrets.POSTHOG_GATEWAYOPS_KEY }}" GOVERNANCE_MODE=off COMPLIANCE_MODE=off DD_METRICS_API_KEY="${{ secrets.DD_METRICS_API_KEY }}" DD_SITE=us3.datadoghq.com DD_API_KEY="${{ secrets.DD_METRICS_API_KEY }}" DD_ENV=production DD_SERVICE=gateway-mcp DD_VERSION="$SUFFIX" DD_AZURE_SUBSCRIPTION_ID=55c84f6b-ef90-4259-a58b-50835cc4cab4 DD_AZURE_RESOURCE_GROUP="$APP_RG" CONTENT_SAFETY_ENDPOINT="${{ secrets.CONTENT_SAFETY_ENDPOINT }}" CONTENT_SAFETY_KEY="${{ secrets.CONTENT_SAFETY_KEY }}" SHIELD_MODE=report GROUNDEDNESS_MODE=report RETRIEVAL_SHIELD_MODE=report LLM_CACHE_MODE=on FAQ_DEFLECT_MODE=on WEBSEARCH_PROJECT_ENDPOINT=https://otchealth-foundry.services.ai.azure.com/api/projects/otchealth-os WEBSEARCH_SP_CLIENT_ID=34a7326b-5ed0-4f6c-b5b4-483772a15a69 WEBSEARCH_SP_TENANT_ID=4ab58580-cc9c-49f7-b5c7-a77f84fdc270 WEBSEARCH_MODEL=gpt-5.4 WEBSEARCH_SP_SECRET=secretref:websearch-sp-secret AZURE_CFO_STORAGE_ACCOUNT=secretref:azure-cfo-storage-account AZURE_CFO_STORAGE_KEY=secretref:azure-cfo-storage-key MEMORY_AUTOSUPERSEDE_MODE=suggest ENABLE_HEYGEN_PROVIDER_WRITES=true ENABLE_HEYGEN_AVATAR_VIDEO_WRITES=true ENABLE_HEYGEN_REFERENCE_LOOK_WRITES=false ENABLE_HEYGEN_VIDEO_AGENT_CHAT_WRITES=false ENABLE_HEYGEN_VIDEO_AGENT_GENERATION=false ENABLE_HEYGEN_ASSET_WRITES=false ENABLE_HEYGEN_TRANSLATION_WRITES=false ENABLE_HEYGEN_TTS_WRITES=false ENABLE_HEYGEN_METADATA_WRITES=false \
            --remove-env-vars BRAIN_SEARCH_ENDPOINT BRAIN_SEARCH_KEY \
            --min-replicas 2 --max-replicas 10 \
            --scale-rule-name http-concurrency --scale-rule-type http --scale-rule-http-concurrency 30 >/dev/null
          # Scale (2026-07-13, §6c gateway-capacity fix for the 2026-07-07 7/7 outage): the app had
          # minReplicas=1/maxReplicas=3 with NO explicit rule, so the default 10-concurrent HTTP scaler
          # wanted ~12 replicas at the observed ~120 concurrent but was capped at 3 -> ~40 concurrent/
          # replica -> overload/flap. min=2 removes the single-replica SPOF; max=10 + a 30-concurrent
          # rule lets it scale out (10 x 30 = 300 concurrent headroom). Set here (not only in the bicep)
          # because deploy.yml is image-only `containerapp update` and inherits scale unless it sets it.
          # Matt directive 2026-07-02: self-imposed guardrails DOWN. GOVERNANCE_MODE=off (charter enforcer
          # off) + COMPLIANCE_MODE=off (regulated-content gate off) so NO tool response is ever gated.
          # APM via serverless-init (agentless, /app/datadog-init entrypoint). REQUIRES the glibc
          # runtime base (node:22-slim) AND the two Azure identifiers below: serverless-init auto-detects
          # Azure Container Apps and its Init() exits non-zero if DD_AZURE_SUBSCRIPTION_ID or
          # DD_AZURE_RESOURCE_GROUP is missing (proven by Datadog's containerapp_test.go; docs list both
          # as Required). That missing pair was the exit-1 root cause. DD_LOGS_ENABLED is set in the image.
          # CONTENT_SAFETY_ENDPOINT/KEY (2026-07-02): activate the already-wired Azure AI Content Safety
          # tools (shield_check / groundedness_check / claims_check, src/safety/content-safety.ts). The
          # code graceful-skips when these are unset, so the tools were registered but INERT in prod. The
          # values are supplied through the production Actions secret boundary (never committed). endpoint =
          # https://cs-otchealth.cognitiveservices.azure.com (resource cs-otchealth).
          echo "revision=${APP}--${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Assert GREEN health + full tool catalog (regression guard)
        run: |
          set -euo pipefail
          FQDN=$(az containerapp revision show -n "$APP" -g "$APP_RG" \
            --revision "${{ steps.green.outputs.revision }}" --query properties.fqdn -o tsv)
          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 25); do
            code=$(curl -fsS -o /tmp/h.json -w '%{http_code}' "https://${FQDN}/health" 2>/dev/null || echo 000)
            [ "$code" = "200" ] && break
            sleep 6
          done
          cat /tmp/h.json
          node -e '
            const h = require("/tmp/h.json");
            if (h.status !== "ok") { console.error("health not ok"); process.exit(1); }
            if (h.read_only_mode !== false || h.enable_write_tools !== true || h.enable_high_risk_tools !== true) {
              console.error("REGRESSION: global write/high-risk gates do not permit the guarded Avatar Video lane"); process.exit(1);
            }
            const n = h.tool_count || 0, min = Number(process.env.MIN_TOOLS);
            if (n < min) { console.error(`REGRESSION: tool_count ${n} < ${min}`); process.exit(1); }
            const hg = h.heygen || {};
            const dark = ["prompt_avatar_writes", "reference_look_writes", "video_agent_chat_writes", "video_agent_generation", "asset_writes", "translation_writes", "tts_writes", "metadata_writes"];
            const unexpectedlyOn = dark.filter((key) => hg[key] !== false);
            if (unexpectedlyOn.length) { console.error(`REGRESSION: unapproved HeyGen write lanes are not dark: ${unexpectedlyOn.join(",")}`); process.exit(1); }
            const required = ["provider_writes", "avatar_video_writes", "owner_approval_verifier_configured", "owner_approval_context_configured", "owner_approval_handle_configured", "owner_approval_callback_configured", "owner_approval_broker_configured"];
            const missing = required.filter((key) => hg[key] !== true);
            if (missing.length) { console.error(`REGRESSION: guarded HeyGen lane not ready: ${missing.join(",")}`); process.exit(1); }
            const expectedCroDirect = ["heygen_avatar_video_create", "heygen_existing_video_ingest_qa", "heygen_video_wait_ingest_qa"];
            if (hg.cro_direct_enabled !== true || JSON.stringify(hg.cro_direct_tools) !== JSON.stringify(expectedCroDirect)) {
              console.error("REGRESSION: exact CRO direct-video/QA surface is not enabled"); process.exit(1);
            }
            const broker = require("/tmp/approval-health.json");
            const bc = broker.approval_compatibility || {}, gc = hg.owner_approval_compatibility || {};
            const compatibilityKeys = ["public_jwk_sha256", "context_secret_sha256", "handle_secret_sha256", "callback_secret_sha256"];
            const mismatch = compatibilityKeys.filter((key) => !/^[a-f0-9]{64}$/.test(bc[key] || "") || bc[key] !== gc[key]);
            if (mismatch.length || broker.issuer !== hg.owner_approval_issuer || broker.audience !== hg.owner_approval_audience || broker.subject_sha256 !== hg.owner_approval_subject_sha256) {
              console.error(`REGRESSION: broker/gateway approval configuration mismatch: ${mismatch.join(",") || "principal claims"}`); process.exit(1);
            }
            console.log(`GREEN healthy: ${n} tools advertised (>= ${min}); guarded Avatar Video lane on, unrelated generation lanes dark, broker/gateway fingerprints match.`);
          '
        id: health

      # Deep dependency gate: /health status + tool_count alone say nothing about whether the
      # GREEN revision can actually REACH Cosmos / Azure AI Search / Foundry, a build with a dead
      # downstream endpoint still returns /health status "ok". /health/deep runs one bounded
      # (2s-timeout) reachability probe per CONFIGURED dependency; an unconfigured optional
      # dependency reports 'unconfigured' and never fails this gate, only a real 'down' does.
      # Requires the ADMIN_REVOKE_TOKEN repo secret (the same bearer already documented in
      # README.md's env-var table and used against POST /admin/revoke); it is never printed.
      - name: Assert GREEN deep-health (Cosmos / Search / Foundry reachability)
        env:
          ADMIN_REVOKE_TOKEN: ${{ secrets.ADMIN_REVOKE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_REVOKE_TOKEN:-}" ]; then
            echo "::warning::ADMIN_REVOKE_TOKEN repo secret is not set; skipping the deep-health gate. Add it (Settings > Secrets and variables > Actions) to enable dependency-reachability gating on every deploy."
            exit 0
          fi
          FQDN="${{ steps.health.outputs.fqdn }}"
          code=$(curl -fsS -o /tmp/hd.json -w '%{http_code}' \
            -H "authorization: Bearer ${ADMIN_REVOKE_TOKEN}" \
            "https://${FQDN}/health/deep" 2>/dev/null || echo 000)
          cat /tmp/hd.json
          node -e '
            const h = require("/tmp/hd.json");
            const deps = { cosmos: h.cosmos, search: h.search, foundry: h.foundry };
            const down = Object.entries(deps).filter(([, v]) => v === "down");
            if (down.length > 0) {
              console.error(`REGRESSION: dependency DOWN on GREEN: ${down.map(([k]) => k).join(", ")}`);
              console.error(JSON.stringify(deps));
              process.exit(1);
            }
            console.log(`GREEN deep-health ok: ${JSON.stringify(deps)} (governance_mode=${h.governance_mode})`);
          '
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "::error::/health/deep returned unexpected HTTP ${code} (expected 200 all-ok or 503 with a dependency down, both parsed above)."
            exit 1
          fi

      - name: Shift 100% traffic to GREEN (blue-green cutover)
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$APP_RG" \
            --revision-weight "${{ steps.green.outputs.revision }}=100"
          echo "Live on ${{ steps.green.outputs.revision }} (digest ${{ steps.digest.outputs.ref }})."

      - name: Restore previous approval broker on failure
        if: failure() && steps.broker.outputs.revision != ''
        run: |
          set -euo pipefail
          OLD="${{ steps.broker.outputs.previous }}"
          NEW="${{ steps.broker.outputs.revision }}"
          if [ -n "$OLD" ]; then
            az containerapp ingress traffic set -n "$APPROVAL_APP" -g "$APP_RG" --revision-weight "${OLD}=100"
            az containerapp revision deactivate -n "$APPROVAL_APP" -g "$APP_RG" --revision "$NEW" || true
            echo "Restored approval broker ${OLD}; deactivated ${NEW}."
          else
            echo "::warning::No prior approval-broker revision existed; leaving ${NEW} active."
          fi

      # Self-healing: any failure after GREEN exists explicitly restores the captured last-good
      # revision before deactivating GREEN. This also covers a partially successful traffic cutover.
      - name: Roll back on failure (deactivate the bad GREEN; traffic stays on blue)
        if: failure() && steps.green.outputs.revision != ''
        run: |
          NEW="${{ steps.green.outputs.revision }}"
          OLD="${{ steps.green.outputs.previous }}"
          echo "::warning::Deploy failed after GREEN came up; restoring the last-good gateway revision before deactivating ${NEW}."
          if [ -n "$OLD" ]; then
            az containerapp ingress traffic set -n "$APP" -g "$APP_RG" --revision-weight "${OLD}=100"
            az containerapp revision deactivate -n "$APP" -g "$APP_RG" --revision "$NEW" || true
          else
            echo "::warning::No prior gateway revision was captured; leaving ${NEW} active for manual recovery."
          fi

      # Release hygiene: keep the now-active GREEN + the single most-recent inactive (instant
      # rollback target); deactivate older inactive revisions so idle replicas stop burning the grant.
      - name: Prune stale revisions (keep active + one warm rollback)
        if: success()
        run: |
          set -euo pipefail
          az containerapp revision list -n "$APP" -g "$APP_RG" -o json \
            | jq -r '[.[] | select(.properties.active and .properties.trafficWeight==0)] | sort_by(.properties.createdTime) | .[:-1] | .[].name' \
            | while read -r rev; do
                [ -n "$rev" ] && (az containerapp revision deactivate -n "$APP" -g "$APP_RG" --revision "$rev" || true)
              done

      - name: Prune zero-traffic approval-broker revisions
        if: success()
        run: |
          set -euo pipefail
          az containerapp revision list -n "$APPROVAL_APP" -g "$APP_RG" -o json \
            | jq -r '.[] | select(.properties.active and .properties.trafficWeight==0) | .name' \
            | while read -r rev; do
                [ -n "$rev" ] && (az containerapp revision deactivate -n "$APPROVAL_APP" -g "$APP_RG" --revision "$rev" || true)
              done

      # P0-EVAL-CI (report-only phase, 2026-07-05): golden-case gateway eval, REPORT-ONLY. Placed as
      # the ABSOLUTE LAST step and continue-on-error so a failure here can NEVER trigger the
      # "Roll back on failure" step above (that step's `if: failure()` only sees steps that ran
      # BEFORE it; nothing after this one in the job, so this step's own outcome cannot cause a
      # rollback of an already-successful cutover). Traffic is already live on GREEN by the time
      # this runs. NOTE: previously considered wiring otchealth-claude-tools' deploy-eval-gate.yml
      # reusable workflow here instead — rejected after investigation: its Checkout step has no
      # `repository:` input so cross-repo it checks out THIS repo (no skills/agent-evals/ here,
      # every step 404s), its baseline.json is still an unpopulated seed (nothing to gate against
      # yet), and its suite scores claude-tools' agent personas, not this gateway — not causally
      # meaningful for a gateway cutover decision. This repo's own src/eval/eval-runner.mjs (hits
      # the live gateway with a bearer token, absolute BASELINE_THRESHOLD) is the correct target.
      # Needs a GATEWAY_BEARER secret (a client_credentials or connector token scoped read-mostly)
      # to be added to this repo's Action secrets before this produces a real signal; until then it
      # exits 2 with a clear "not configured" message every run — visible, not silently skipped.
      - name: Golden-case eval (report-only; needs GATEWAY_BEARER secret to activate)
        if: success()
        continue-on-error: true
        env:
          GATEWAY_BASE_URL: https://mcp.otchealth.app
          GATEWAY_BEARER: ${{ secrets.GATEWAY_BEARER }}
        run: node src/eval/eval-runner.mjs
