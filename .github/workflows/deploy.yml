name: deploy

# The golden-path release pipeline for the gateway. Deploys ONLY from green main, builds the
# image ONCE and promotes it by immutable @sha256 DIGEST, brings up a GREEN revision at 0%
# traffic, asserts health + the full tool catalog (regression guard for the 2026-07-01
# 838->subset regression), then shifts traffic. The `production` GitHub Environment gates the
# deploy behind a required reviewer (separation of duties). Auth is OIDC (no stored SP secret).
#
# AUTO-DEPLOY: runs on every push to main (i.e. every merge) AND on manual dispatch. Safe because
# (1) branch protection means only build-green code reaches main, (2) the OAuth auth-code store now
# lives in Cosmos so a blue-green revision cutover no longer drops live sessions, and (3) the health
# + tool_count gate below refuses to shift traffic to a bad revision. Rollback = the previous
# immutable digest is still a healthy 0%-traffic revision.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this deploy (audit note)'
        required: false
        default: 'manual release from green main'
  push:
    branches: [main]
    # Only redeploy when something that actually changes the built image changes. A workflow /
    # infra / docs-only merge must NOT spend an ACR build + revision cutover.
    paths-ignore:
      - '.github/**'
      - 'infra/**'
      - 'docs/**'
      - '**.md'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ACR: acrotc55c84f6bef
  APP: otchealth-mcp-gateway
  APP_RG: rg-otchealth-apps-prod
  IMAGE_REPO: otchealth-mcp-server
  MIN_TOOLS: '800' # regression floor; the catalog is ~838

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # human approval gate; reviewer must differ from the release opener
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          # These are non-secret Azure identifiers, NOT credentials. Security is the OIDC federated
          # credential on the `id-gateway-deployer` user-assigned managed identity, which trusts only
          # subject `repo:InnerScopeHearing/otchealth-mcp-server:environment:production`. That identity
          # is least-privilege (Contributor on rg-otchealth-apps-prod + the acrotc55c84f6bef registry
          # only). Hardcoded so the pipeline is self-contained, no repo-variable/secret setup required.
          client-id: 0918788a-f290-4a25-b4cd-2cf3a6faaf57 # id-gateway-deployer (UAMI) clientId
          tenant-id: 4ab58580-cc9c-49f7-b5c7-a77f84fdc270
          subscription-id: 55c84f6b-ef90-4259-a58b-50835cc4cab4

      - name: Build once (immutable, tagged by git sha)
        run: az acr build -r "$ACR" -t "${IMAGE_REPO}:${GITHUB_SHA}" -f Dockerfile .

      - name: Resolve immutable digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST=$(az acr repository show -n "$ACR" --image "${IMAGE_REPO}:${GITHUB_SHA}" --query digest -o tsv)
          echo "ref=${ACR}.azurecr.io/${IMAGE_REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Deploying digest ${DIGEST}"

      - name: Ensure multiple-revision mode (blue-green)
        run: az containerapp revision set-mode -n "$APP" -g "$APP_RG" --mode multiple

      - name: Deploy GREEN revision (starts at 0% traffic)
        id: green
        run: |
          set -euo pipefail
          SUFFIX="g$(echo "$GITHUB_SHA" | cut -c1-8)"
          az containerapp update -n "$APP" -g "$APP_RG" \
            --image "${{ steps.digest.outputs.ref }}" --revision-suffix "$SUFFIX" \
            --set-env-vars POSTHOG_GATEWAYOPS_KEY="${{ secrets.POSTHOG_GATEWAYOPS_KEY }}" GOVERNANCE_MODE=report DD_METRICS_API_KEY="${{ secrets.DD_METRICS_API_KEY }}" DD_SITE=us3.datadoghq.com >/dev/null
          # NOTE: APM (DD_API_KEY/DD_ENV/DD_SERVICE/DD_VERSION) was tried and REVERTED 2026-07-02:
          # dd-trace needs a Datadog Agent to forward traces, and this Container App has no agent
          # sidecar, so setting DD_API_KEY put the gateway into CrashLoopBackOff (blue-green caught
          # it, prod unaffected). To enable APM, first add a datadog/agent sidecar container (DD_API_KEY
          # + DD_SITE) so dd-trace can reach it at localhost:8126, THEN re-add these env vars.
          echo "revision=${APP}--${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Assert GREEN health + full tool catalog (regression guard)
        run: |
          set -euo pipefail
          FQDN=$(az containerapp revision show -n "$APP" -g "$APP_RG" \
            --revision "${{ steps.green.outputs.revision }}" --query properties.fqdn -o tsv)
          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 25); do
            code=$(curl -fsS -o /tmp/h.json -w '%{http_code}' "https://${FQDN}/health" 2>/dev/null || echo 000)
            [ "$code" = "200" ] && break
            sleep 6
          done
          cat /tmp/h.json
          node -e '
            const h = require("/tmp/h.json");
            if (h.status !== "ok") { console.error("health not ok"); process.exit(1); }
            const n = h.tool_count || 0, min = Number(process.env.MIN_TOOLS);
            if (n < min) { console.error(`REGRESSION: tool_count ${n} < ${min}`); process.exit(1); }
            console.log(`GREEN healthy: ${n} tools advertised (>= ${min}).`);
          '
        id: health

      # Deep dependency gate: /health status + tool_count alone say nothing about whether the
      # GREEN revision can actually REACH Cosmos / Azure AI Search / Foundry, a build with a dead
      # downstream endpoint still returns /health status "ok". /health/deep runs one bounded
      # (2s-timeout) reachability probe per CONFIGURED dependency; an unconfigured optional
      # dependency reports 'unconfigured' and never fails this gate, only a real 'down' does.
      # Requires the ADMIN_REVOKE_TOKEN repo secret (the same bearer already documented in
      # README.md's env-var table and used against POST /admin/revoke); it is never printed.
      - name: Assert GREEN deep-health (Cosmos / Search / Foundry reachability)
        env:
          ADMIN_REVOKE_TOKEN: ${{ secrets.ADMIN_REVOKE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_REVOKE_TOKEN:-}" ]; then
            echo "::warning::ADMIN_REVOKE_TOKEN repo secret is not set; skipping the deep-health gate. Add it (Settings > Secrets and variables > Actions) to enable dependency-reachability gating on every deploy."
            exit 0
          fi
          FQDN="${{ steps.health.outputs.fqdn }}"
          code=$(curl -fsS -o /tmp/hd.json -w '%{http_code}' \
            -H "authorization: Bearer ${ADMIN_REVOKE_TOKEN}" \
            "https://${FQDN}/health/deep" 2>/dev/null || echo 000)
          cat /tmp/hd.json
          node -e '
            const h = require("/tmp/hd.json");
            const deps = { cosmos: h.cosmos, search: h.search, foundry: h.foundry };
            const down = Object.entries(deps).filter(([, v]) => v === "down");
            if (down.length > 0) {
              console.error(`REGRESSION: dependency DOWN on GREEN: ${down.map(([k]) => k).join(", ")}`);
              console.error(JSON.stringify(deps));
              process.exit(1);
            }
            console.log(`GREEN deep-health ok: ${JSON.stringify(deps)} (governance_mode=${h.governance_mode})`);
          '
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "::error::/health/deep returned unexpected HTTP ${code} (expected 200 all-ok or 503 with a dependency down, both parsed above)."
            exit 1
          fi

      - name: Shift 100% traffic to GREEN (blue-green cutover)
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$APP_RG" \
            --revision-weight "${{ steps.green.outputs.revision }}=100"
          echo "Live on ${{ steps.green.outputs.revision }} (digest ${{ steps.digest.outputs.ref }})."

      # Self-healing: if anything after the GREEN revision came up failed (health gate, cutover),
      # traffic never left the last-good (blue) revision. Deactivate the bad GREEN so it does not
      # linger as an idle warm replica burning the shared free grant. Rollback is automatic: blue
      # still holds 100% traffic.
      - name: Roll back on failure (deactivate the bad GREEN; traffic stays on blue)
        if: failure() && steps.green.outputs.revision != ''
        run: |
          echo "::warning::Deploy failed after GREEN came up. Traffic stayed on the last-good revision; deactivating ${{ steps.green.outputs.revision }}."
          az containerapp revision deactivate -n "$APP" -g "$APP_RG" \
            --revision "${{ steps.green.outputs.revision }}" || true

      # Release hygiene: keep the now-active GREEN + the single most-recent inactive (instant
      # rollback target); deactivate older inactive revisions so idle replicas stop burning the grant.
      - name: Prune stale revisions (keep active + one warm rollback)
        if: success()
        run: |
          set -euo pipefail
          az containerapp revision list -n "$APP" -g "$APP_RG" -o json \
            | jq -r '[.[] | select(.properties.active and .properties.trafficWeight==0)] | sort_by(.properties.createdTime) | .[:-1] | .[].name' \
            | while read -r rev; do
                [ -n "$rev" ] && (az containerapp revision deactivate -n "$APP" -g "$APP_RG" --revision "$rev" || true)
              done
