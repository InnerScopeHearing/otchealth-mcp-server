name: Verify AWS gateway deep health

on:
  workflow_dispatch:
    inputs:
      expected_image_tag:
        description: "Expected live tag: 40-character lowercase merge SHA with an optional safe suffix"
        required: true
        type: string
      expected_image_digest:
        description: "Expected live OCI image digest (sha256 followed by 64 lowercase hex characters)"
        required: true
        type: string
      expected_task_definition:
        description: "Expected live ECS task definition (otchealth-gateway:<positive revision>)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'InnerScopeHearing/otchealth-mcp-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify live gateway health
        env:
          ADMIN_REVOKE_TOKEN: ${{ secrets.ADMIN_REVOKE_TOKEN }}
          EXPECTED_IMAGE_TAG: ${{ inputs.expected_image_tag }}
          EXPECTED_IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
          EXPECTED_TASK_DEFINITION: ${{ inputs.expected_task_definition }}
        run: python3 scripts/check-deep-health.py
