# ⛔ DISARMED 2026-08-18 -- this workflow targets Azure, and Azure is GONE.
#
# Subscription 55c84f6b-ef90-4259-a58b-50835cc4cab4 was disabled (credit exhaustion) and is not
# coming back. Every Azure resource this workflow touches -- the ACR it builds in, the Container App
# it releases to, the revisions it inspects -- no longer exists. It therefore CANNOT succeed again,
# and it was failing on every single push to main.
#
# WHY DISARMED RATHER THAN DELETED. A red X on every merge is worse than no signal at all: it trains
# everyone to ignore the check, and the next REAL failure hides inside that noise. But the file also
# encodes real, hard-won release logic (immutable digest promotion, green-at-zero-traffic, the health
# + tool-count gate that guards the 2026-07-01 catalog regression), and that logic is worth having in
# front of whoever builds the equivalent AWS path. So the automatic triggers are removed and the file
# stays, readable, as a reference. workflow_dispatch is left in place so it can still be run by hand
# if some part of Azure ever returns.
#
# THE LIVE PATH IS ELSEWHERE:
#   image build   -> .github/workflows/build-gateway-ecr.yml   (AWS ECR, the registry prod pulls from)
#   deploy / ops  -> InnerScopeHearing/otchealth-cto .github/workflows/aws-recovery-console.yml
# See runbooks/DAY-2026-08-18-CTO-RECOVERY.md in otchealth-cto for the full picture.

name: digest-drift

# Guards against out-of-band / hand deploys. The live gateway revision MUST run an immutable
# @sha256 digest (never a mutable :tag like the :phase5 regression), and that digest must carry an
# ACR tag (the git commit SHA deploy.yml tags every build with) that is an ancestor of main. On
# drift it fails the run and opens a single deduped issue.
#
# Auth is OIDC via the id-gateway-deployer managed identity (environment: production subject).
#
# 2026-08-01 fix (found during a live Copilot-fleet cold-start audit): this used to parse the
# CONTAINER APP REVISION NAME (expecting a "g<sha>" suffix) instead of checking the image itself.
# A same-day out-of-band `az containerapp update --set-env-vars ...` (no --revision-suffix, e.g.
# wiring the M365 static agent tokens / TOOL_CATALOG_CURATION_MODE) creates a new revision on
# Azure's default auto-numbered suffix (e.g. "--0000038") WITHOUT changing the running image --
# the revision name check then false-drifted on every run even though the correct, verified digest
# was still live, four days straight, silently desensitizing the one alert built to catch a REAL
# bad deploy. Fixed to check the thing that actually matters: does the live IMAGE DIGEST carry an
# ACR tag that is a real commit on main (deploy.yml always tags the image with $GITHUB_SHA before
# pushing), regardless of what the Container App happened to name that revision.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: digest-drift
  cancel-in-progress: false

env:
  APP: otchealth-mcp-gateway
  APP_RG: rg-otchealth-apps-prod

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: 0918788a-f290-4a25-b4cd-2cf3a6faaf57
          tenant-id: 4ab58580-cc9c-49f7-b5c7-a77f84fdc270
          subscription-id: 55c84f6b-ef90-4259-a58b-50835cc4cab4

      - name: Inspect the live revision
        id: drift
        run: |
          set -euo pipefail
          LIVE=$(az containerapp revision list -n "$APP" -g "$APP_RG" -o json \
            | jq -c 'sort_by(.properties.trafficWeight) | reverse | .[0]')
          NAME=$(echo "$LIVE" | jq -r '.name')
          IMG=$(echo "$LIVE" | jq -r '.properties.template.containers[0].image')
          echo "live revision: $NAME"
          echo "live image:    $IMG"
          DRIFT=""
          # 1) must be an immutable digest, not a mutable tag (the phase5-style hand-deploy signature)
          case "$IMG" in
            *@sha256:*) : ;;
            *) DRIFT="live image is a MUTABLE TAG, not an @sha256 digest: ${IMG} (a hand-deploy bypassed the pipeline)";;
          esac
          # 2) the live digest must carry an ACR tag that is a commit on the checked-out main HEAD
          # (deploy.yml always tags the pushed image with $GITHUB_SHA -- check the IMAGE, not the
          # Container App's revision NAME, since an env-var-only update creates a new revision with
          # an unrelated auto-numbered suffix while keeping the same, correct image).
          if [ -z "$DRIFT" ]; then
            DIGEST="${IMG##*@}"
            TAGS=$(az acr repository show --name acrotc55c84f6bef --image "otchealth-mcp-server@${DIGEST}" --query 'tags' -o tsv 2>/dev/null || echo "")
            MATCHED=""
            for TAG in $TAGS; do
              if git merge-base --is-ancestor "$TAG" HEAD 2>/dev/null; then
                MATCHED="$TAG"
                break
              fi
            done
            if [ -z "$MATCHED" ]; then
              DRIFT="live image digest ${DIGEST} (revision ${NAME}) has no ACR tag matching a commit on main (tags found: ${TAGS:-none}) -- untracked / hand-built image"
            fi
          fi
          {
            echo "drift<<EOF"
            echo "$DRIFT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$DRIFT" ]; then echo "::error::DIGEST DRIFT: $DRIFT"; else echo "OK: live is a green-main digest."; fi

      - name: Open a deduped issue + fail on drift
        if: steps.drift.outputs.drift != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.drift.outputs.drift }}
          TITLE: 'Gateway digest drift detected'
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            printf '%s\n\n%s\n' "The live gateway revision is not a green-main @sha256 digest." "$DRIFT" \
              | gh issue create --title "$TITLE" --body-file - || true
          else
            echo "An open drift issue already exists; not duplicating."
          fi
          exit 1
