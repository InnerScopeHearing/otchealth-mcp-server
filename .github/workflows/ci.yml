name: ci

# The green-main gate. Runs on every PR to main and on push to main. Making this a REQUIRED
# status check (+ "require branches up to date") is what makes deploy-from-stale-branch,
# merging-into-red-main, and dropped-file merges structurally impossible. Build once here is
# a typecheck/build/test proof; the immutable release artifact is built by deploy.yml on merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (frozen lockfile)
        run: npm ci --include=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            node -e "const fs=require('fs');const lines=fs.readFileSync('/tmp/test-output.log','utf8').split(/\r?\n/);const out=[];for(let i=0;i<lines.length;i++){if(/^not ok /.test(lines[i]))out.push(...lines.slice(Math.max(0,i-3),Math.min(lines.length,i+45)));}out.push(...lines.slice(-30));let s=out.join('\n').slice(-60000);s=s.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');console.log('::error title=Test failure details::'+s)"
          fi
          exit "$status"
