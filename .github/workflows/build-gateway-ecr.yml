name: build-gateway-ecr

# Build + push the gateway image to AWS ECR -- the registry the RUNNING production service actually
# pulls from (ECS service otchealth-gateway, cluster otchealth, us-east-1).
#
# WHY THIS EXISTS ALONGSIDE deploy.yml: deploy.yml builds in AZURE ACR and releases to an Azure
# Container App via Azure OIDC. Every part of it dies with the Azure account, and it has never once
# updated the image the AWS service runs. Production has been served from AWS since the DNS cutover,
# so without this workflow a merged PR could look shipped and never reach a single live replica.
# Merged is not deployed.
#
# CREDENTIALS: a DEDICATED least-privilege IAM user (otchealth-ci-ecr-gateway) whose ONLY permissions
# are ecr:GetAuthorizationToken plus push/pull on the otchealth-mcp-gateway repository. Verified at
# provisioning time that it is correctly DENIED ssm:GetParameter, so a leak of these CI credentials
# cannot read a single fleet secret. Deliberately NOT the broad aws-cto key.
#
# DEPLOY IS DELIBERATELY NOT HERE. This workflow only produces an image. Registering a task
# definition and updating the service stays with the operator, so that triggering a workflow can
# never reshape production -- CI's entire blast radius is "can overwrite an image tag".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and push (default: the commit sha)'
        required: false
        default: ''

permissions:
  contents: read
  # Required to mint the OIDC token aws-actions/configure-aws-credentials exchanges for a
  # short-lived AWS credential below. Granting this alone authorizes nothing by itself -- it only
  # lets the workflow REQUEST a token; whether any AWS role trusts that token is decided entirely
  # by that role's own trust policy (infra/oidc/policies/trust-gateway-ecr-push.json in
  # otchealth-cto), not by anything in this file.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        env:
          REQUESTED: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # Default to the short commit sha so every image is traceable to exact source, matching
          # how the currently-running image (267f89d) was named.
          TAG="${REQUESTED:-$(git rev-parse --short HEAD)}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "building tag: $TAG"

      # ── Multi-arch (Graviton prep) ──────────────────────────────────────────────
      # Audited 2026-08-29: every base image in this Dockerfile (node:22, node:22-slim,
      # datadog/serverless-init:1.9.16) already publishes a linux/arm64/v8 manifest, the apt
      # packages (curl, ca-certificates) are ordinary multi-arch Debian bookworm packages, the
      # RDS cert ADD is a plain-text PEM (architecture-independent), and dd-trace's only native
      # transitive deps (@datadog/native-appsec, -native-iast-taint-tracking, -native-metrics,
      # -pprof, -libdatadog) ship prebuildify binaries for linuxglibc-arm64 bundled in the SAME
      # npm tarball (confirmed by downloading and inspecting each tgz), so npm ci's normal
      # per-platform selection at require-time handles arm64 with zero Dockerfile changes. No
      # --platform pin or arch-conditional logic exists anywhere in this Dockerfile.
      # So the ONLY change needed is here: emulate + build for both platforms and push ONE
      # multi-arch manifest under the same tag. ECS/Fargate already resolves the correct
      # platform-specific manifest from a multi-arch tag at pull time based on each task
      # definition's runtimePlatform, so this is safe to land and push before any task
      # definition is touched -- the currently-running amd64 service keeps pulling amd64 from
      # this exact tag until a task definition is deliberately switched to ARM64/Graviton.
      # Depot's remote builders are native linux/amd64 AND linux/arm64 hardware, so this no longer
      # needs docker/setup-qemu-action (arm64 emulation) or docker/setup-buildx-action at all --
      # depot/build-push-action drives the build on Depot's own infrastructure and only pushes the
      # resulting manifest through this runner's already-authenticated ECR docker credential.

      # OIDC role when the repo variable is configured; the pre-existing static ECR-push IAM
      # user's key as a fallback otherwise. Exactly one of role-to-assume / access-key-id ever
      # evaluates non-empty, never both -- see otchealth-cto/infra/oidc/README.md for why (in
      # short: aws-actions/configure-aws-credentials treats a non-empty role-to-assume PLUS a
      # non-empty static key as "use the static key to assume the role," which the new OIDC
      # role's trust policy does not authorize and would fail). Until AWS_OIDC_ROLE_ARN is set as
      # a repository variable (otchealth-cto/infra/oidc/apply-github-oidc-roles.sh prints the
      # exact command once the role exists), this resolves to the second branch on every run,
      # unchanged from today. This credential is verified DENIED ssm:GetParameter (see
      # infra/oidc/permissions-gateway-ecr-push.json in otchealth-cto), matching the existing
      # static IAM user's own least-privilege scope.
      - name: Configure AWS credentials (OIDC role when configured, static key fallback otherwise)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          role-session-name: gateway-ecr-push-${{ github.run_id }}
          aws-access-key-id: ${{ vars.AWS_OIDC_ROLE_ARN == '' && secrets.ECR_AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ vars.AWS_OIDC_ROLE_ARN == '' && secrets.ECR_AWS_SECRET_ACCESS_KEY || '' }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

      - name: Build and push (linux/amd64 + linux/arm64) via Depot
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          # The account's one existing Depot project (confirmed live via the gateway's
          # depot_list_projects on 2026-09-03: id p5k0c551zm, name "default" -- it is the ONLY
          # project in the account, already shared across whatever else runs through Depot Build
          # here). Overridable via a repo variable if the CTO later splits the gateway onto its
          # own dedicated Depot project; falls back to the one confirmed-live project otherwise.
          project: ${{ vars.DEPOT_PROJECT_ID || 'p5k0c551zm' }}
          token: ${{ secrets.DEPOT_TOKEN }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/otchealth-mcp-gateway:${{ steps.tag.outputs.tag }}
          # No cache-from/cache-to: Depot's remote builders maintain their own persistent
          # per-project build cache automatically; the GHA-cache inputs the buildx path needed are
          # Depot-irrelevant and removed rather than carried over as dead configuration.
          # Keep the pushed artifact a plain two-platform manifest list, matching today's shape
          # (one manifest per tag) just widened to two platforms. Provenance/SBOM attestations
          # add extra referrer manifests to the index that nothing downstream has ever had to
          # parse before; that is a real, separate supply-chain hardening step worth doing
          # deliberately later, not as a side effect of a Graviton-prep PR on the production
          # gateway's registry.
          provenance: false
          sbom: false

      - name: Report the pushed digest + confirm both platforms landed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Print the digest so the operator can prove WHICH image they are about to deploy, rather
          # than trusting that a push happened. Same discipline as the rest of this migration:
          # assert on the observable result, never on the command exiting 0.
          aws ecr describe-images --repository-name otchealth-mcp-gateway \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].{tag:imageTags[0],digest:imageDigest,pushed:imagePushedAt,mediaType:imageManifestMediaType}' \
            --output table

          # A multi-platform build-push-action run can still silently degrade to one platform
          # (a QEMU hiccup, a platform-specific build failure buildx doesn't hard-fail on in some
          # configurations, etc.) -- so don't just trust that the step exited 0. Pull the actual
          # manifest list back from ECR and assert BOTH platforms are really in it before this
          # workflow is allowed to report success.
          aws ecr batch-get-image --repository-name otchealth-mcp-gateway \
            --image-ids imageTag="$TAG" \
            --query 'images[0].imageManifest' --output text > /tmp/manifest.json

          echo "Platforms present under tag $TAG:"
          jq -r '.manifests[]? | "  " + .platform.os + "/" + .platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end) + "  " + .digest' /tmp/manifest.json

          for want in "linux/amd64" "linux/arm64"; do
            jq -e --arg want "$want" '.manifests[]? | select((.platform.os + "/" + .platform.architecture) == $want)' /tmp/manifest.json > /dev/null \
              || { echo "MISSING platform $want under tag $TAG -- multi-arch push did not complete as expected"; exit 1; }
          done
          echo "Confirmed: both linux/amd64 and linux/arm64 are present under otchealth-mcp-gateway:$TAG"
