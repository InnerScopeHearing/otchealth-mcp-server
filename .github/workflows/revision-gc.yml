# ⛔ DISARMED 2026-08-18 -- this workflow targets Azure, and Azure is GONE.
#
# Subscription 55c84f6b-ef90-4259-a58b-50835cc4cab4 was disabled (credit exhaustion) and is not
# coming back. Every Azure resource this workflow touches -- the ACR it builds in, the Container App
# it releases to, the revisions it inspects -- no longer exists. It therefore CANNOT succeed again,
# and it was failing on every single push to main.
#
# WHY DISARMED RATHER THAN DELETED. A red X on every merge is worse than no signal at all: it trains
# everyone to ignore the check, and the next REAL failure hides inside that noise. But the file also
# encodes real, hard-won release logic (immutable digest promotion, green-at-zero-traffic, the health
# + tool-count gate that guards the 2026-07-01 catalog regression), and that logic is worth having in
# front of whoever builds the equivalent AWS path. So the automatic triggers are removed and the file
# stays, readable, as a reference. workflow_dispatch is left in place so it can still be run by hand
# if some part of Azure ever returns.
#
# THE LIVE PATH IS ELSEWHERE:
#   image build   -> .github/workflows/build-gateway-ecr.yml   (AWS ECR, the registry prod pulls from)
#   deploy / ops  -> InnerScopeHearing/otchealth-cto .github/workflows/aws-recovery-console.yml
# See runbooks/DAY-2026-08-18-CTO-RECOVERY.md in otchealth-cto for the full picture.

name: revision-gc

# Release-hygiene backstop. Deactivates idle (0%-traffic) container-app revisions so they stop
# burning warm replicas against the shared Container Apps free grant. deploy.yml already prunes on
# every deploy; this weekly job catches anything that accumulates between deploys. Always keeps the
# active revision + the single most-recent inactive one (the instant-rollback target).
#
# Auth is OIDC via the id-gateway-deployer managed identity, so this job declares environment:
# production (that is the federated-credential subject). No stored secret.
#
# NOTE ON `environment: production` (verified live against the GitHub API on 2026-08-18): this
# declaration is REQUIRED and load-bearing, because the Azure OIDC federated credential trusts only
# the subject `repo:InnerScopeHearing/otchealth-mcp-server:environment:production`. Removing it
# breaks auth. It does NOT supply a human approval gate. This repo's `production` environment has
# `protection_rules: []` and `can_admins_bypass: true` -- no required reviewers, no self-review
# prevention. Declaring an environment does not create protection on it; that is configured on the
# environment itself, separately. For contrast, InnerScopeHearing/flatstick's `production` DOES have
# a required reviewer (GBGolfMatt), which is the likely source of the belief that this one did too.
# If the AWS successor to this workflow wants separation of duties, it must be configured, not
# assumed -- and asserting it in a comment does not make it so.
#

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: revision-gc
  cancel-in-progress: false

env:
  APP: otchealth-mcp-gateway
  APP_RG: rg-otchealth-apps-prod

jobs:
  gc:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: 0918788a-f290-4a25-b4cd-2cf3a6faaf57
          tenant-id: 4ab58580-cc9c-49f7-b5c7-a77f84fdc270
          subscription-id: 55c84f6b-ef90-4259-a58b-50835cc4cab4

      - name: Deactivate idle revisions (keep active + one warm rollback)
        run: |
          set -euo pipefail
          KEPT=$(az containerapp revision list -n "$APP" -g "$APP_RG" -o json \
            | jq -r '[.[] | select(.properties.active and .properties.trafficWeight==0)] | sort_by(.properties.createdTime) | .[:-1] | .[].name')
          if [ -z "$KEPT" ]; then echo "Nothing to prune (<=1 idle revision)."; exit 0; fi
          echo "$KEPT" | while read -r rev; do
            [ -n "$rev" ] && echo "deactivating $rev" && (az containerapp revision deactivate -n "$APP" -g "$APP_RG" --revision "$rev" || true)
          done
